[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "commando"
version = "0.1.0"
description = "A minimal tabbed local-shell terminal with a command sidebar"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "mFat" }]
keywords = ["terminal", "vte", "gtk4", "libadwaita"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "PyGObject>=3.42",
    "pycairo>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/mfat/commando"

[project.scripts]
commando = "commando.app:main"

[tool.setuptools.packages.find]
include = ["commando*"]
